services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatapp-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=chatapp
      - DB_USER=postgres
      - DB_PASSWORD=123456
      - MQTT_BROKER=tcp://emqx:1883
    depends_on:
      postgres:
        condition: service_healthy
      emqx:
        condition: service_started
    networks:
      - chatapp-network
    restart: unless-stopped
    
  postgres:
    image: postgres:15-alpine
    container_name: chatapp-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=chatapp
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chatapp-network
    restart: unless-stopped

  emqx:
    image: emqx/emqx:latest
    container_name: chatapp-emqx
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "18083:18083"
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=node1.emqx.local
      - EMQX_NODE__COOKIE=emqx_secret_cookie
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks:
      - chatapp-network
    restart: unless-stopped
networks:
  chatapp-network:
    driver: bridge
volumes:
  postgres-data:
  emqx-data:
  emqx-log: