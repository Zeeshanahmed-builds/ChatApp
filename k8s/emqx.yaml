apiVersion: apps/v1
kind: Deployment

metadata:
  name: emqx
  namespace: chat-app

spec:

  replicas: 1

  selector:
    matchLabels:
      app: emqx

  template:

    metadata:
      labels:
        app: emqx

    spec:

      containers:

      - name: emqx

        image: emqx/emqx:latest

        ports:

        - containerPort: 1883

        - containerPort: 18083

---
apiVersion: v1
kind: Service

metadata:
  name: emqx
  namespace: chat-app

spec:
  type: NodePort

  selector:
    app: emqx

  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
    nodePort: 31883

  - name: dashboard
    port: 18083
    targetPort: 18083
    nodePort: 31803