name: Go CI
on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Download Dependencies
        run: go mod download
        
      - name: Verify Dependencies
        run: go mod verify

      - name: Format Check
        run: test -z "$(gofmt -l .)"

      - name: Run Tests
        run: go test ./...

      - name: Build Project
        run: go build -v ./...